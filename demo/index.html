<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Persona-Serve Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; background: #0f1115; color: #e8eaed; }
    h1 { font-size: 1.25rem; }
    .panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .pane { border: 1px solid #333; border-radius: 8px; padding: 0.75rem; background: #161a22; }
    .pane h2 { margin: 0 0 0.5rem; font-size: 1rem; }
    .log { height: 160px; overflow-y: auto; font-size: 0.85rem; background: #0b0d11; padding: 0.5rem; border-radius: 4px; }
    input, button { width: 100%; margin-top: 0.5rem; padding: 0.4rem; }
    #stats { margin-bottom: 1rem; font-size: 0.9rem; color: #9aa0a6; }
  </style>
</head>
<body>
  <h1>Persona-Serve — multi-pane chat (stub)</h1>
  <div id="stats">Loading stats…</div>
  <div class="panes" id="panes"></div>
  <script>
    const personas = ["alpha", "beta", "gamma"];
    async function refreshStats() {
      const r = await fetch("/stats");
      const s = await r.json();
      document.getElementById("stats").textContent =
        `tokens/s: ${s.tokens_per_sec} | batch: ${s.batch_size} | D: ${s.distinct_adapters} | slots: ${s.resident_slots}`;
    }
    function addPane(id) {
      const el = document.createElement("div");
      el.className = "pane";
      el.innerHTML = `<h2>${id}</h2><div class="log" id="log-${id}"></div>
        <input id="in-${id}" placeholder="Message…" />
        <button type="button">Send</button>`;
      el.querySelector("button").onclick = async () => {
        const input = document.getElementById(`in-${id}`);
        const log = document.getElementById(`log-${id}`);
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ persona_id: id, message: input.value }),
        });
        const text = await res.text();
        log.textContent += "You: " + input.value + "\n" + text + "\n";
        input.value = "";
      };
      document.getElementById("panes").appendChild(el);
    }
    personas.forEach(addPane);
    refreshStats();
  </script>
</body>
</html>
