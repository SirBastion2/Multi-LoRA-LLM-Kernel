[build-system]
requires = ["setuptools>=61", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-lora-llm-kernel"
version = "0.1.0"
description = "Multi-LoRA serving with custom BGMV CUDA kernels on a shared NF4 base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "safetensors",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "transformers",
    "peft",
    "accelerate",
    "bitsandbytes",
]
[tool.pytest.ini_options]
markers = [
    "cuda: requires CUDA GPU",
]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["persona*"]
